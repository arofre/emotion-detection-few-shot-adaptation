[project]
name = "emotion-detection"
version = "1.0.0"
description = "Facial detection with emotion recognition on limited training data"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "facenet-pytorch>=2.6.0",
    "matplotlib>=3.11.2",
    "opencv-python>=4.11.0.86",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "torch==2.2.0",
    "torchvision==0.17.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
